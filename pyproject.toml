[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crawler-platform-spiders"
version = "1.0.0"
description = "Containerized spider runtime for crawler_platform"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}
authors = [{name = "crawler_platform"}]
dependencies = [
  "pydantic>=2.8,<3",
  "SQLAlchemy>=2.0.36,<3",
  "PyMySQL>=1.1.1,<2",
  "pymongo>=4.10,<5",
  "redis>=5.2,<7",
  "httpx>=0.27,<1"
]

[project.optional-dependencies]
browser = ["DrissionPage>=4.1,<5"]
fingerprint = ["curl_cffi>=0.7,<1"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
crawler-spiders = "crawler_platform_spiders.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 120
